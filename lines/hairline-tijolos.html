<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tijolos — Hairline</title>
<style>
:root{color-scheme:light;--ground:#fff;--ink:#232327;--muted:#6f6f78;--line:#e0e0e4;--crease:#9a9aa2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#08090a;--ink:#d0d6e0;--muted:#8a8c95;--line:#29292d;--crease:#707680}}
:root[data-theme="dark"]{color-scheme:dark;--ground:#08090a;--ink:#d0d6e0;--muted:#8a8c95;--line:#29292d;--crease:#707680}:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ground);color:var(--ink);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{width:100%;max-width:640px}.plate{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden}.tag,button{font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}.tag{position:absolute;top:12px;left:14px;color:var(--muted)}svg{display:block;width:100%;height:auto;overflow:hidden}.solid{fill:var(--ground);stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.crease{fill:none;stroke:var(--crease);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.brick{transform-box:view-box;transform-origin:200px 180px}.controls{display:flex;align-items:center;gap:10px;margin-top:14px}.label{font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}.description{margin:14px 0 0}.note{color:var(--muted);margin:6px 0 0;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.playing .brick{animation:arrive 520ms cubic-bezier(.32,.72,0,1) both;animation-delay:var(--delay)}@keyframes arrive{0%{opacity:0;transform:translate(var(--shift),-36px) rotate(var(--angle))}15%{opacity:1}78%{transform:translate(0,1px) rotate(.15deg)}90%{transform:translate(0,-.35px) rotate(0)}100%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.playing .brick{animation:none}}
</style></head><body><main><div class="plate"><span class="tag">tijolos</span><svg class="playing" viewBox="0 0 400 320" role="img" aria-label="Seis tijolos empilhados em três níveis"><defs><g id="block"><path class="solid" d="M3 2 Q0 3 2 5 L135 65 Q137 66 140 65 L208 45 Q210 44 210 42 L210 74 Q210 76 208 77 L140 97 Q137 98 135 97 L2 37 Q0 36 0 34 L0 5 Q0 3 3 2 L68 -17 Q71 -18 73 -17 L207 41 Q210 42 208 44 L140 64 Q137 65 135 64 L2 5"/><path class="crease" d="M4 5 L136 63 Q138 64 140 63 L205 44"/></g></defs>
<!-- Back to front in each row, then bottom to top. -->
<g class="brick" style="--delay:0ms;--shift:-6px;--angle:-1deg"><use href="#block" transform="translate(161 182) scale(.65)"/></g>
<g class="brick" style="--delay:100ms;--shift:5px;--angle:1deg"><use href="#block" transform="translate(115.5 195) scale(.65)"/></g>
<g class="brick" style="--delay:200ms;--shift:-5px;--angle:-1deg"><use href="#block" transform="translate(70 208) scale(.65)"/></g>
<g class="brick" style="--delay:400ms;--shift:5px;--angle:1deg"><use href="#block" transform="translate(138.25 167.7) scale(.65)"/></g>
<g class="brick" style="--delay:510ms;--shift:-5px;--angle:-1deg"><use href="#block" transform="translate(92.75 180.7) scale(.65)"/></g>
<g class="brick" style="--delay:800ms;--shift:7px;--angle:1deg"><use href="#block" transform="translate(115.5 153.4) scale(.65)"/></g>
</svg></div><div class="controls"><span class="label">theme</span><button id="theme" type="button" aria-label="Alternar tema">dark</button><span class="label">animation</span><button id="replay" type="button">Replay</button></div><p class="description">Uma pequena pilha de tijolos para o estado vazio de insumos.</p><p class="note">Traço e fundo inspirados no Hairline. Sem interação com o cursor.</p></main><script>
const root=document.documentElement,svg=document.querySelector('svg'),theme=document.querySelector('#theme');function themeLabel(){const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;theme.textContent=dark?'light':'dark'}theme.addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';themeLabel()});document.querySelector('#replay').addEventListener('click',()=>{svg.classList.remove('playing');void svg.getBoundingClientRect();svg.classList.add('playing')});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeLabel);themeLabel();
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamentos — maquete em balanço</title><style>
:root{color-scheme:light dark;--ground:#fff;--ink:#323439;--fine:#90949b;--border:#e0e0e4;--muted:#6f6f78}@media(prefers-color-scheme:dark){:root{--ground:#08090a;--ink:#cbd0d8;--fine:#818790;--border:#29292d;--muted:#8a8c95}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ground);color:var(--ink);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}main{width:100%;max-width:640px}.plate{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden}.tag{position:absolute;top:12px;left:14px;color:var(--muted);font:11px ui-monospace,monospace}.art{display:block;width:100%;height:auto}.art .face{fill:var(--ground);stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.art .line{fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.art .fine{fill:none;stroke:var(--fine);stroke-width:.85;stroke-linejoin:round;stroke-linecap:round}.caption{margin:14px 0 0}.note{color:var(--muted);font:11px/1.5 ui-monospace,monospace;margin:6px 0 0}
</style></head><body><main><div class="plate"><span class="tag">03 / balanços</span><svg class="art" viewBox="0 0 400 320" role="img" aria-labelledby="title desc"><title id="title">Maquete arquitetônica com volumes em balanço</title><desc id="desc">Três níveis assimétricos com um terraço recuado, uma ala avançada e uma cobertura recortada.</desc>
<!-- Plinth: an irregular footprint supporting the three connected volumes. -->
<g id="base"><path class="face" d="M64 231 L161 193 L326 242 L228 280 Z"/><path class="face" d="M64 231 L228 280 L228 288 L64 239 Z"/><path class="face" d="M228 280 L326 242 L326 250 L228 288 Z"/></g>
<!-- Lower story, with a stepped front and a recess at the right. -->
<g id="pavimento-inferior"><path class="face" d="M84 185 L164 155 L301 196 L219 227 Z"/><path class="face" d="M84 185 L219 227 L219 264 L182 253 L182 244 L157 236 L157 246 L84 224 Z"/><path class="face" d="M219 227 L301 196 L301 233 L276 243 L276 232 L251 241 L251 252 L219 264 Z"/><path class="fine" d="M104 200 L138 210 L138 225 M234 239 L253 232"/></g>
<!-- Setback reveals the lower roof as a terrace on the right and front. -->
<g id="pavimento-intermediario"><path class="face" d="M99 151 L168 125 L269 155 L201 182 Z"/><path class="face" d="M99 151 L201 182 L201 219 L99 188 Z"/><path class="face" d="M201 182 L269 155 L269 192 L201 219 Z"/><path class="fine" d="M111 164 L135 171 L135 184 M225 193 L250 183"/></g>
<!-- A cantilevered wing projects to the left, with its own underside. -->
<g id="balanco"><path class="face" d="M67 151 L133 126 L185 142 L119 167 Z"/><path class="face" d="M67 151 L119 167 L119 191 L67 175 Z"/><path class="face" d="M119 167 L185 142 L185 166 L119 191 Z"/><path class="fine" d="M77 164 L101 171"/></g>
<!-- Upper block is offset backwards, exposing a terrace to its right. -->
<g id="pavimento-superior"><path class="face" d="M118 116 L174 95 L242 115 L186 137 Z"/><path class="face" d="M118 116 L186 137 L186 169 L118 148 Z"/><path class="face" d="M186 137 L242 115 L242 147 L186 169 Z"/><path class="fine" d="M129 129 L152 136 M199 149 L225 139"/></g>
<!-- Thin roof plate, cut into an L; top faces remain clean and untextured. -->
<g id="cobertura"><path class="face" d="M110 110 L173 86 L250 109 L229 117 L244 122 L186 144 L111 121 Z"/><path class="face" d="M111 121 L186 144 L186 149 L111 126 Z"/><path class="face" d="M186 144 L244 122 L244 127 L186 149 Z"/><path class="fine" d="M123 111 L174 92 L232 109"/></g>
<!-- Restrained terrace rails describe usable outdoor space. -->
<g id="terracos"><path class="fine" d="M218 213 L218 202 L246 191 M218 209 L246 198 M218 202 L228 205 M232 202 L232 212 M240 199 L240 209 M255 205 L280 195 L280 185 M255 205 L255 195"/><path class="fine" d="M209 174 L209 165 L226 158 M209 171 L226 164"/></g>
</svg></div><p class="caption">Estudo 03 — maquete com alas deslocadas e terraços.</p><p class="note">Estudo estático · sem animação</p></main></body></html>

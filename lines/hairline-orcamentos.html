<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edifício — Hairline</title><style>
:root{color-scheme:light dark;--ground:#fff;--ink:#45464b;--sub:#8b8d92;--line:#e0e0e4;--text:#232327;--muted:#6f6f78}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ground:#08090a;--ink:#c4cad2;--sub:#808792;--line:#29292d;--text:#d0d6e0;--muted:#8a8c95}}:root[data-theme=dark]{color-scheme:dark;--ground:#08090a;--ink:#c4cad2;--sub:#808792;--line:#29292d;--text:#d0d6e0;--muted:#8a8c95}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ground);color:var(--text);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}main{width:100%;max-width:640px}.plate{border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}.tag{position:absolute;top:12px;left:14px;color:var(--muted);font:11px ui-monospace,monospace}.art{display:block;width:100%;height:auto}.art path{fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}.art .detail{stroke:var(--sub);stroke-width:.85}.controls{display:flex;align-items:center;gap:10px;margin-top:14px}.label{color:var(--muted);font:11px ui-monospace,monospace}button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:11px ui-monospace,monospace;cursor:pointer}button:focus-visible{outline:1.5px solid var(--text);outline-offset:2px}.description{margin:14px 0 0}.building-floor{transform-box:fill-box;transform-origin:bottom}.roof{transform-box:fill-box;transform-origin:center}.playing .foundation path{stroke-dasharray:700;animation:draw 400ms cubic-bezier(.32,.72,0,1) both}.playing .floor-one{animation:rise 470ms 300ms cubic-bezier(.32,.72,0,1) both}.playing .floor-two{animation:rise 480ms 650ms cubic-bezier(.32,.72,0,1) both}.playing .floor-three{animation:rise 500ms 1020ms cubic-bezier(.32,.72,0,1) both}.playing .roof{animation:roof 480ms 1510ms cubic-bezier(.32,.72,0,1) both}@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}@keyframes rise{from{transform:scaleY(.001)}to{transform:scaleY(1)}}@keyframes roof{from{opacity:0;transform:translateY(-18px)}25%{opacity:1}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.playing .foundation path,.playing .building-floor,.playing .roof{animation:none}}
</style></head><body><main><div class="plate"><span class="tag">edifício</span><svg class="art playing" viewBox="0 0 400 320" role="img" aria-labelledby="title"><title id="title">Edifício de três pavimentos construído sobre uma base</title>
<!-- Base, pavimentos e cobertura são desenhados com arestas compartilhadas uma única vez. -->
<g class="foundation"><path d="M110 221 L200 251 L290 221 M110 221 L110 228 L200 258 L290 228 L290 221 M200 251 L200 258"/></g>
<g class="building-floor floor-one"><path d="M110 221 L110 182 M200 251 L200 212 M290 221 L290 182 M110 182 L200 212 L290 182"/><path class="detail" d="M128 200 L148 207 L148 219 L128 212 Z M160 211 L180 218 L180 230 L160 223 Z M219 222 L237 216 L237 198 L219 204 Z M251 210 L271 203 L271 191 L251 198 Z"/></g>
<g class="building-floor floor-two"><path d="M110 182 L110 143 M200 212 L200 173 M290 182 L290 143 M110 143 L200 173 L290 143"/><path class="detail" d="M128 161 L148 168 L148 180 L128 173 Z M160 172 L180 179 L180 191 L160 184 Z M220 178 L240 171 L240 183 L220 190 Z M252 167 L272 160 L272 172 L252 179 Z"/></g>
<g class="building-floor floor-three"><path d="M110 143 L110 104 M200 173 L200 134 M290 143 L290 104 M110 104 L200 134 L290 104"/><path class="detail" d="M128 122 L148 129 L148 141 L128 134 Z M160 133 L180 140 L180 152 L160 145 Z M220 139 L240 132 L240 144 L220 151 Z M252 128 L272 121 L272 133 L252 140 Z"/></g>
<g class="roof"><path d="M119 103 L200 77 L281 104" class="detail"/><path d="M110 104 L200 74 L290 104"/></g>
</svg></div><div class="controls"><span class="label">tema</span><button id="theme" type="button" aria-label="Alternar tema">dark</button><span class="label">animação</span><button id="replay" type="button">Replay</button></div><p class="description">Um edifício toma forma, pavimento a pavimento.</p></main><script>
const root=document.documentElement,art=document.querySelector('.art'),button=document.querySelector('#theme'),media=matchMedia('(prefers-color-scheme: dark)');function label(){const dark=root.dataset.theme?root.dataset.theme==='dark':media.matches;button.textContent=dark?'light':'dark'}button.addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':media.matches;root.dataset.theme=dark?'light':'dark';label()});media.addEventListener('change',label);label();document.querySelector('#replay').addEventListener('click',()=>{art.classList.remove('playing');void art.getBoundingClientRect();art.classList.add('playing')});
</script></body></html>
